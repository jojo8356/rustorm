name: Rust tests
on: [push, pull_request]
permissions: write-all
jobs:
  test-offline:
    runs-on: ${{ matrix.os }}
    strategy: {fail-fast: false, matrix: {os: [ubuntu-latest, windows-latest, macos-latest]}}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch deps for offline tests
        shell: bash
        run: |
          cargo update || true
          cargo fetch || true
      - name: Cargo check offline
        shell: bash
        run: cargo check --offline 2>&1 | tail -n 50
      - name: Test without optional connector (offline, multi-OS)
        id: cargo_test
        shell: bash
        continue-on-error: true
        run: |
          cargo test --locked --offline -- --nocapture 2>&1 | tee "$RUNNER_TEMP/cargo_test.log"
          test ${PIPESTATUS[0]} -eq 0
      - name: Show cargo test log tail
        if: always()
        shell: bash
        run: |
          echo "=== cargo test log tail ==="
          cat "$RUNNER_TEMP/cargo_test.log" 2>&1 | tail -n 300 || true
          echo "=== grep FAILED ==="
          grep -E "FAILED|test result|failures:" "$RUNNER_TEMP/cargo_test.log" 2>&1 | tail -n 100 || true
      - name: Check performance baseline budgets (offline)
        id: perf
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          cargo test --locked --offline --test performance_baseline -- --nocapture 2>&1 | tee "$RUNNER_TEMP/perf.log"
          test ${PIPESTATUS[0]} -eq 0
      - name: Show perf log
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/perf.log" 2>&1 | tail -n 300 || true
      - name: Check AC matrix + Prisma diff + multi-OS (offline)
        id: matrix
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          cargo test --locked --offline --test test_matrix_ac_jalons --test prisma_diff --test multi_os_verification -- --nocapture 2>&1 | tee "$RUNNER_TEMP/matrix.log"
          test ${PIPESTATUS[0]} -eq 0
      - name: Show matrix log
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/matrix.log" 2>&1 | tail -n 400 || true
      - name: Run baseline benches (offline)
        id: benches
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          cargo test --locked --offline --bench baseline -- --nocapture 2>&1 | tee "$RUNNER_TEMP/benches.log"
          test ${PIPESTATUS[0]} -eq 0 || (cargo test --locked --offline --benches -- --nocapture 2>&1 | tee "$RUNNER_TEMP/benches.log"; test ${PIPESTATUS[0]} -eq 0)
      - name: Fail if any offline check failed
        if: always()
        shell: bash
        run: |
          echo "outcomes cargo=${{ steps.cargo_test.outcome }} perf=${{ steps.perf.outcome }} matrix=${{ steps.matrix.outcome }} benches=${{ steps.benches.outcome }}"
          test "${{ steps.cargo_test.outcome }}" == "success" && test "${{ steps.perf.outcome }}" == "success" && test "${{ steps.matrix.outcome }}" == "success" && test "${{ steps.benches.outcome }}" == "success"
      - name: Report offline diagnostics via issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "diag ${GITHUB_SHA:0:7} ${RUNNER_OS}" > /tmp/diag.txt
          for f in cargo_test.log perf.log matrix.log benches.log; do
            echo "--- $f tail ---" >> /tmp/diag.txt
            cat "$RUNNER_TEMP/$f" 2>&1 | tail -n 200 >> /tmp/diag.txt || echo "no $f" >> /tmp/diag.txt
          done
          echo "--- cargo_test fresh grep FAILED ---" >> /tmp/diag.txt
          cargo test --locked --offline -- --nocapture 2>&1 | grep -E "FAILED|test result|failures:" | tail -n 100 >> /tmp/diag.txt || true
          echo "--- perf fresh ---" >> /tmp/diag.txt
          cargo test --locked --offline --test performance_baseline -- --nocapture 2>&1 | tail -n 100 >> /tmp/diag.txt || true
          echo "--- matrix fresh ---" >> /tmp/diag.txt
          cargo test --locked --offline --test test_matrix_ac_jalons --test prisma_diff -- --nocapture 2>&1 | tail -n 200 >> /tmp/diag.txt || true
          echo "--- benches fresh ---" >> /tmp/diag.txt
          cargo test --locked --offline --bench baseline -- --nocapture 2>&1 | tail -n 200 >> /tmp/diag.txt || true
          cat /tmp/diag.txt
          gh issue create --title "ci diag ${GITHUB_SHA:0:7} ${RUNNER_OS}" --body-file /tmp/diag.txt || true
  test:
    runs-on: ubuntu-latest
    strategy: {fail-fast: false, matrix: {postgres: [16,18]}}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: {POSTGRES_USER: rustorm, POSTGRES_DB: rustorm_test, POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rustorm -d rustorm_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env: {RUSTORM_TEST_DATABASE_PORT: 5432, RUSTORM_TEST_DATABASE_USER: rustorm, RUSTORM_TEST_DATABASE_NAME: rustorm_test}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Fetch deps for offline tests
        shell: bash
        run: |
          cargo update || true
          cargo fetch || true
      - name: Test without optional connector
        id: cargo_test_pg
        shell: bash
        continue-on-error: true
        run: |
          cargo test -- --nocapture 2>&1 | tee "$RUNNER_TEMP/cargo_test.log"
          test ${PIPESTATUS[0]} -eq 0
      - name: Show cargo test log
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/cargo_test.log" 2>&1 | tail -n 300 || true
      - name: Fail if cargo_test failed
        if: always()
        shell: bash
        run: test "${{ steps.cargo_test_pg.outcome }}" == "success"
      - name: Report PG diag
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat "$RUNNER_TEMP/cargo_test.log" 2>&1 | tail -n 400 > /tmp/pg_diag.txt || echo "no pg log" > /tmp/pg_diag.txt
          cargo test --locked --offline -- --nocapture 2>&1 | tail -n 200 >> /tmp/pg_diag.txt || true
          gh issue create --title "ci PG diag ${GITHUB_SHA:0:7}" --body-file /tmp/pg_diag.txt || true
      - name: Test with connector enabled
        shell: bash
        run: cargo test --locked --offline --features postgres -- --nocapture
      - name: Test with sqlx connector enabled
        shell: bash
        run: cargo test --locked --offline --features sqlx -- --nocapture
      - name: Run real PostgreSQL integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL migration integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test migrations_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL relation integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test relations_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL cardinality integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test cardinalities_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL composite primary key tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test composite_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL named relation tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test named_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL nested-write integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test nested_create_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL nested disconnect tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test nested_disconnect_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL transaction integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test transactions_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL connector integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test connector_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL sqlx connector tests
        shell: bash
        run: cargo test --locked --offline --features sqlx --test connector_sqlx -- --ignored -- --nocapture
      - name: Run shadow database planning tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test shadow_postgres -- --ignored -- --nocapture
      - name: Run PG performance baseline (p50/p95/p99 budgets)
        shell: bash
        run: cargo test --locked --offline --features postgres --test performance_postgres -- --ignored -- --nocapture
      - name: Run PG Prisma differential (PG16/18)
        shell: bash
        run: cargo test --locked --offline --features postgres --test prisma_diff_postgres -- --ignored -- --nocapture
