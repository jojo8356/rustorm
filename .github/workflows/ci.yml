name: Rust tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {fail-fast: false, matrix: {postgres: [16,18]}}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: {POSTGRES_USER: rustorm, POSTGRES_DB: rustorm_test, POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rustorm -d rustorm_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env: {RUSTORM_TEST_DATABASE_PORT: 5432, RUSTORM_TEST_DATABASE_USER: rustorm, RUSTORM_TEST_DATABASE_NAME: rustorm_test}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Fetch deps for offline tests
        run: |
          cargo update || true
          cargo fetch || true
      - name: Test without optional connector
        run: cargo test --locked --offline -- --nocapture
      - name: Test with connector enabled
        shell: bash
        run: |
          set +e
          cargo test --locked --offline --features postgres -- --nocapture 2>&1 | tee /tmp/pg_feat.log
          CODE=${PIPESTATUS[0]}
          if [ $CODE -ne 0 ]; then
            echo "::error::PG_FEAT_FAILED exit $CODE"
            sed 's/\x1b\[[0-9;]*m//g' /tmp/pg_feat.log | tail -n 200 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error::$esc"
            done
            exit $CODE
          fi
          exit 0
      - name: Run real PostgreSQL integration tests
        run: cargo test --locked --offline --features postgres --test postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL migration integration tests
        run: cargo test --locked --offline --features postgres --test migrations_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL relation integration tests
        run: cargo test --locked --offline --features postgres --test relations_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL cardinality integration tests
        run: cargo test --locked --offline --features postgres --test cardinalities_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL composite primary key tests
        run: cargo test --locked --offline --features postgres --test composite_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL named relation tests
        run: cargo test --locked --offline --features postgres --test named_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL nested-write integration tests
        run: cargo test --locked --offline --features postgres --test nested_create_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL nested disconnect tests
        run: cargo test --locked --offline --features postgres --test nested_disconnect_postgres -- --ignored -- --nocapture
      - name: Run shadow database planning tests
        run: cargo test --locked --offline --features postgres --test shadow_postgres -- --ignored -- --nocapture
