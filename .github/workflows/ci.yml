name: Rust tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: rustorm
          POSTGRES_DB: rustorm_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustorm -d rustorm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUSTORM_TEST_DATABASE_PORT: 5432
      RUSTORM_TEST_DATABASE_USER: rustorm
      RUSTORM_TEST_DATABASE_NAME: rustorm_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libpq development files
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Test without optional connector
        run: cargo test --locked --offline -- --test-threads=1 --nocapture 2>&1 | tee /tmp/fail.txt; test ${PIPESTATUS[0]} -eq 0 || (echo "::error::OFFLINE FAILED $(grep -A 30 -E 'SQL_MISSING|SQL for|fk_composite' /tmp/fail.txt | head -c 3000)"; cat /tmp/fail.txt | grep -A 30 -E "SQL_MISSING|SQL for|fk_composite" | head -n 150; echo "---FULL FAIL---"; cat /tmp/fail.txt | grep -A 50 "fk_composite_ddl_has_two_refs" | head -n 100; exit 1)
      - name: Diagnostic single test verbose
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion -- --nocapture 2>&1 | grep -A 10 -E "SQL for|SQL1" | head -n 50; echo "SINGLE_EXIT:$?"
      - name: Diagnostic print fk sql
        if: always()
        continue-on-error: true
        run: |
          cat > /tmp/print_fk.rs <<'RS'
          use rustorm::schema::parse;
          use rustorm::migrations::initial_sql;
          fn main() {
              let header = "datasource db { provider = \"postgresql\" url = env(\"DATABASE_URL\") } generator client { provider = \"rustorm-client\" output = \"./src/generated/rustorm\" } ";
              let src = format!("{} model P {{ id Int @id sec String @unique vals Val[] @@id([id, sec]) }} model Val {{ id Int @id p1 Int p2 String p P @relation(fields: [p1, p2], references: [id, sec], onDelete: Restrict, onUpdate: Cascade) }}", header);
              let schema = parse(&src).unwrap();
              let sql = initial_sql(&schema).unwrap();
              println!("PRINTED_SQL: {}", sql);
              if sql.contains("FOREIGN KEY") { println!("HAS_FK"); } else { println!("NO_FK"); }
          }
          RS
          cp /tmp/print_fk.rs /tmp/print_fk_main.rs
          # Use cargo script via `cargo run` with a temporary bin
          mkdir -p /tmp/print_fk_bin/src
          cp /tmp/print_fk.rs /tmp/print_fk_bin/src/main.rs
          cat > /tmp/print_fk_bin/Cargo.toml <<'TOML'
          [package]
          name = "print_fk_bin"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          rustorm = { path = "/home/user/rustorm" }
          TOML
          cargo run --manifest-path /tmp/print_fk_bin/Cargo.toml 2>&1 | grep -E "PRINTED_SQL|HAS_FK|NO_FK" | head -n 20
          echo "PRINT_EXIT:$?"
      - name: Test with connector enabled
        run: cargo test --locked --offline --features postgres
      - name: Run real PostgreSQL integration tests
        run: cargo test --locked --offline --features postgres --test postgres -- --ignored
      - name: Run PostgreSQL migration integration tests
        run: cargo test --locked --offline --features postgres --test migrations_postgres -- --ignored
      - name: Run PostgreSQL relation integration tests
        run: cargo test --locked --offline --features postgres --test relations_postgres -- --ignored
      - name: Run PostgreSQL cardinality integration tests
        run: cargo test --locked --offline --features postgres --test cardinalities_postgres -- --ignored
      - name: Run PostgreSQL composite primary key tests
        run: cargo test --locked --offline --features postgres --test composite_postgres -- --ignored
      - name: Run PostgreSQL named relation tests
        run: cargo test --locked --offline --features postgres --test named_postgres -- --ignored
      - name: Run PostgreSQL nested-write integration tests
        run: cargo test --locked --offline --features postgres --test nested_create_postgres -- --ignored
      - name: Run PostgreSQL nested disconnect tests
        run: cargo test --locked --offline --features postgres --test nested_disconnect_postgres -- --ignored
      - name: Run shadow database planning tests
        run: cargo test --locked --offline --features postgres --test shadow_postgres -- --ignored
