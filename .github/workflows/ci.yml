name: Rust tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {fail-fast: false, matrix: {postgres: [16,18]}}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: {POSTGRES_USER: rustorm, POSTGRES_DB: rustorm_test, POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rustorm -d rustorm_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env: {RUSTORM_TEST_DATABASE_PORT: 5432, RUSTORM_TEST_DATABASE_USER: rustorm, RUSTORM_TEST_DATABASE_NAME: rustorm_test}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Fetch deps for offline tests
        run: |
          cargo update || true
          cargo fetch || true
      - name: Test without optional connector
        run: cargo test --locked --offline -- --nocapture
      - name: Test with connector enabled
        run: |
          set +e
          cargo test --locked --offline --features postgres -- --nocapture > /tmp/pg.log 2>&1
          s=$?
          cat /tmp/pg.log
          echo "EXIT:$s"
          if [ $s -ne 0 ]; then
            echo "----PG FAIL GREP----"
            grep -E "FAILED|failures:|test result|error\[E" /tmp/pg.log | head -n 100 > /tmp/grep.log
            cat /tmp/grep.log
            while IFS= read -r line; do safe=$(echo "$line" | sed 's/%/%25/g' | tr -d '\r' | cut -c1-500); echo "::error::$safe"; done < /tmp/grep.log
            tail -n 50 /tmp/pg.log > /tmp/tail.log
            while IFS= read -r line; do safe=$(echo "$line" | sed 's/%/%25/g' | tr -d '\r' | cut -c1-500); echo "::error::TAIL:$safe"; done < /tmp/tail.log
            exit $s
          fi
