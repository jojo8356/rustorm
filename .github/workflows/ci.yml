name: Rust tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {fail-fast: false, matrix: {postgres: [16,18]}}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: {POSTGRES_USER: rustorm, POSTGRES_DB: rustorm_test, POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rustorm -d rustorm_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env: {RUSTORM_TEST_DATABASE_PORT: 5432, RUSTORM_TEST_DATABASE_USER: rustorm, RUSTORM_TEST_DATABASE_NAME: rustorm_test}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: cargo check offline
        run: |
          cargo check --locked --offline 2>&1 | tee /tmp/check.log
          s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then
            echo "---- CHECK FAIL ----"
            cat /tmp/check.log
            head -n 150 /tmp/check.log > /tmp/head.log
            msg=$(cat /tmp/head.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-4000)
            echo "::error title=Cargo check offline failed::$msg"
            exit $s
          fi
      - name: cargo check postgres
        run: |
          cargo check --locked --offline --features postgres 2>&1 | tee /tmp/check2.log
          s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then
            head -n 150 /tmp/check2.log > /tmp/h2.log
            msg=$(cat /tmp/h2.log | tr '\n' ' ' | cut -c1-4000)
            echo "::error title=Cargo check postgres failed::$msg"
            exit $s
          fi
      - name: Test without optional connector
        run: cargo test --locked --offline -- --nocapture
