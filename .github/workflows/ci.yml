name: Rust tests
on: [push, pull_request]
permissions: write-all
jobs:
  test-offline:
    runs-on: ${{ matrix.os }}
    strategy: {fail-fast: false, matrix: {os: [ubuntu-latest, windows-latest, macos-latest]}}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch deps for offline tests
        shell: bash
        run: |
          cargo update || true
          cargo fetch || true
      - name: Test without optional connector (offline, multi-OS)
        shell: bash
        run: cargo test --locked --offline -- --nocapture 2>&1 | tee "$RUNNER_TEMP/offline.log"; test ${PIPESTATUS[0]} -eq 0
      - name: Dump log on failure
        if: failure()
        shell: bash
        run: |
          echo "=== offline.log tail ==="
          tail -n 400 "$RUNNER_TEMP/offline.log" || cat "$RUNNER_TEMP/offline.log" || true
          echo "=== cargo check ==="
          cargo check --offline 2>&1 | head -n 100 || true
      - name: Check performance baseline budgets (offline)
        shell: bash
        run: cargo test --locked --offline --test performance_baseline -- --nocapture
      - name: Check AC matrix + Prisma diff + multi-OS (offline)
        shell: bash
        run: cargo test --locked --offline --test test_matrix_ac_jalons --test prisma_diff --test multi_os_verification -- --nocapture
      - name: Run baseline benches (offline)
        shell: bash
        run: cargo test --locked --offline --bench baseline -- --nocapture || cargo test --locked --offline --benches -- --nocapture
      - name: Report failure via issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const logPath = path.join(process.env.RUNNER_TEMP || '/tmp', 'offline.log');
            let log = '';
            try { log = fs.readFileSync(logPath, 'utf8').slice(-60000); } catch(e) { log = 'no log: '+e + ' path='+logPath; }
            const title = `ci offline failed ${context.sha.slice(0,7)}`;
            const body = '```\n' + log.slice(-50000) + '\n```';
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
  test:
    runs-on: ubuntu-latest
    strategy: {fail-fast: false, matrix: {postgres: [16,18]}}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: {POSTGRES_USER: rustorm, POSTGRES_DB: rustorm_test, POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rustorm -d rustorm_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env: {RUSTORM_TEST_DATABASE_PORT: 5432, RUSTORM_TEST_DATABASE_USER: rustorm, RUSTORM_TEST_DATABASE_NAME: rustorm_test}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Fetch deps for offline tests
        shell: bash
        run: |
          cargo update || true
          cargo fetch || true
      - name: Test without optional connector
        shell: bash
        run: cargo test --locked --offline -- --nocapture 2>&1 | tee "$RUNNER_TEMP/offline_pg.log"; test ${PIPESTATUS[0]} -eq 0
      - name: Dump PG log on failure
        if: failure()
        shell: bash
        run: tail -n 400 "$RUNNER_TEMP/offline_pg.log" || cat "$RUNNER_TEMP/offline_pg.log" || true
      - name: Test with connector enabled
        shell: bash
        run: cargo test --locked --offline --features postgres -- --nocapture
      - name: Test with sqlx connector enabled
        shell: bash
        run: cargo test --locked --offline --features sqlx -- --nocapture
      - name: Run real PostgreSQL integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL migration integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test migrations_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL relation integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test relations_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL cardinality integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test cardinalities_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL composite primary key tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test composite_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL named relation tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test named_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL nested-write integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test nested_create_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL nested disconnect tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test nested_disconnect_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL transaction integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test transactions_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL connector integration tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test connector_postgres -- --ignored -- --nocapture
      - name: Run PostgreSQL sqlx connector tests
        shell: bash
        run: cargo test --locked --offline --features sqlx --test connector_sqlx -- --ignored -- --nocapture
      - name: Run shadow database planning tests
        shell: bash
        run: cargo test --locked --offline --features postgres --test shadow_postgres -- --ignored -- --nocapture
      - name: Run PG performance baseline (p50/p95/p99 budgets)
        shell: bash
        run: cargo test --locked --offline --features postgres --test performance_postgres -- --ignored -- --nocapture
      - name: Run PG Prisma differential (PG16/18)
        shell: bash
        run: cargo test --locked --offline --features postgres --test prisma_diff_postgres -- --ignored -- --nocapture
      - name: Report PG failure via issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const logPath = path.join(process.env.RUNNER_TEMP || '/tmp', 'offline_pg.log');
            let log = '';
            try { log = fs.readFileSync(logPath, 'utf8').slice(-60000); } catch(e) { log = 'no log: '+e + ' path='+logPath; }
            const title = `ci PG failed ${context.sha.slice(0,7)}`;
            const body = '```\n' + log.slice(-50000) + '\n```';
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
