name: Rust tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: rustorm
          POSTGRES_DB: rustorm_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustorm -d rustorm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUSTORM_TEST_DATABASE_PORT: 5432
      RUSTORM_TEST_DATABASE_USER: rustorm
      RUSTORM_TEST_DATABASE_NAME: rustorm_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libpq development files
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Diagnostic list offline tests
        run: cargo test --locked --offline -- --list 2>&1 | head -n 100
      - name: Diagnostic check p1_m5
        run: cargo test --locked --offline --test p1_m5_completion -- --list 2>&1 | head -n 100
      - name: Diagnostic run p1_m5 only
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion -- --nocapture
      - name: Diagnostic p1_m5 fk
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion fk_composite -- --nocapture
      - name: Diagnostic p1_m5 enum
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion enum_with_map -- --nocapture
      - name: Diagnostic p1_m5 triple
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion triple_slash -- --nocapture
      - name: Diagnostic p1_m5 generate
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion generate_contains -- --nocapture
      - name: Diagnostic p1_m5 builder
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion builder_api -- --nocapture
      - name: Diagnostic p1_m5 migrate
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion migrate_create -- --nocapture
      - name: Diagnostic p1_m5 json
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion json_filters -- --nocapture
      - name: Diagnostic p1_m5 bytes
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion bytes_and -- --nocapture
      - name: Diagnostic p1_m5 introspection
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion introspection_offline -- --nocapture
      - name: Diagnostic p1_m5 find_unique
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion find_unique -- --nocapture
      - name: Diagnostic p1_m5 filter_in
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion filter_in -- --nocapture
      - name: Diagnostic p1_m5 aggregate
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion aggregate_count -- --nocapture
      - name: Diagnostic p1_m5 distinct
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --test p1_m5_completion distinct_with -- --nocapture
      - name: Diagnostic which offline suite fails
        if: always()
        continue-on-error: true
        run: |
          for t in $(ls tests/*.rs | xargs -n1 basename | sed 's/\.rs$//' | tr '\n' ' '); do
            echo "=== $t ==="
            cargo test --locked --offline --test $t -- --nocapture 2>&1 | tail -n 5
            status=${PIPESTATUS[0]}
            if [ $status -ne 0 ]; then
              echo "::error::FAILED $t"
            else
              echo "::notice::PASSED $t"
            fi
          done
      - name: Diagnostic lib unit tests
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --lib -- --nocapture 2>&1 | tail -n 20; echo "LIB_EXIT:${PIPESTATUS[0]}"
      - name: Diagnostic bins
        if: always()
        continue-on-error: true
        run: cargo test --locked --offline --bins -- --nocapture 2>&1 | tail -n 20; echo "BIN_EXIT:${PIPESTATUS[0]}"
      - name: Test without optional connector
        run: cargo test --locked --offline
      - name: Test with connector enabled
        run: cargo test --locked --offline --features postgres
      - name: Run real PostgreSQL integration tests
        run: cargo test --locked --offline --features postgres --test postgres -- --ignored
      - name: Run PostgreSQL migration integration tests
        run: cargo test --locked --offline --features postgres --test migrations_postgres -- --ignored
      - name: Run PostgreSQL relation integration tests
        run: cargo test --locked --offline --features postgres --test relations_postgres -- --ignored
      - name: Run PostgreSQL cardinality integration tests
        run: cargo test --locked --offline --features postgres --test cardinalities_postgres -- --ignored
      - name: Run PostgreSQL composite primary key tests
        run: cargo test --locked --offline --features postgres --test composite_postgres -- --ignored
      - name: Run PostgreSQL named relation tests
        run: cargo test --locked --offline --features postgres --test named_postgres -- --ignored
      - name: Run PostgreSQL nested-write integration tests
        run: cargo test --locked --offline --features postgres --test nested_create_postgres -- --ignored
      - name: Run PostgreSQL nested disconnect tests
        run: cargo test --locked --offline --features postgres --test nested_disconnect_postgres -- --ignored
      - name: Run shadow database planning tests
        run: cargo test --locked --offline --features postgres --test shadow_postgres -- --ignored
