[package]
name = "rustorm"
version = "0.1.0"
edition = "2021"
description = "Rust-first schema and typed query foundation — .rsm parser, codegen, query builder, migrations & Postgres connector"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jojo8356/rustorm"
homepage = "https://github.com/jojo8356/rustorm"
readme = "README.md"
keywords = ["orm", "postgres", "prisma", "codegen", "query-builder"]
categories = ["database", "database-implementations"]
authors = ["jojo8356"]
exclude = [".github/", "docs/", "benches/", "tests/"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "rt"] }
deadpool = { version = "0.12", features = ["managed", "rt_tokio_1"] }
sqlx = { version = "0.8", optional = true, features = ["runtime-tokio", "tls-rustls", "postgres"] }

[features]
default = []
postgres = []
sqlx = ["postgres", "dep:sqlx", "tokio/time"]

[lib]
name = "rustorm"
path = "src/lib.rs"

[[bin]]
name = "rustorm"
path = "src/main.rs"

[[bench]]
name = "baseline"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
