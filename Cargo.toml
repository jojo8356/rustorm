[package]
name = "rustorm"
version = "0.1.0"
edition = "2021"
description = "Rust-first schema and typed query foundation"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "rt"] }
deadpool = { version = "0.12", features = ["managed", "rt_tokio_1"] }
sqlx = { version = "0.8", optional = true, features = ["runtime-tokio", "tls-rustls", "postgres"] }

[features]
default = []
postgres = []
sqlx = ["postgres", "dep:sqlx", "tokio/time"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rustorm"
path = "src/main.rs"

[[bench]]
name = "baseline"
harness = false
